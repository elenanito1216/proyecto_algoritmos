# =============================================================================
# Configuracion unica del proyecto
# "Deteccion de Grietas e Inclinacion de Elementos Estructurales
#  para la Evaluacion de Riesgo en Edificaciones"
#
# Universidad Industrial de Santander - Ingenieria en Inteligencia Artificial
# Asignatura: Algoritmos y Programacion (2026-2)
#
# REGLA DEL PROYECTO: ningun script, modulo o notebook debe contener rutas
# absolutas ni hiperparametros incrustados. Todo vive aqui. Las rutas se
# interpretan SIEMPRE como relativas a la raiz del repositorio (la carpeta que
# contiene este archivo), resueltas con pathlib en src/utils/rutas.py.
# =============================================================================

proyecto:
  nombre: "crack-risk-assessment"
  # Semilla global: se propaga a numpy, random, tensorflow y al split.
  # Cambiarla aqui es la unica forma legitima de cambiar la aleatoriedad.
  semilla: 42

# -----------------------------------------------------------------------------
# RUTAS (relativas a la raiz del repo)
# -----------------------------------------------------------------------------
rutas:
  # Dataset publico etiquetado (Concrete Crack Images / SDNET2018 o similar).
  # Admite dos estructuras, detectadas automaticamente por src/data/loader.py:
  #   (a) subcarpetas por clase:  data/raw/Positive/*.jpg  y  data/raw/Negative/*.jpg
  #   (b) CSV de etiquetas:       data/raw/labels.csv  con columnas configuradas abajo
  datos_raw: "data/raw"

  # Fotografias tomadas por el equipo. SOLO se usan como conjunto de prueba
  # final; nunca entran al entrenamiento ni a la validacion. Misma estructura
  # que datos_raw (subcarpetas por clase o CSV).
  datos_propias: "data/propias"

  modelos: "models"
  reportes: "reports"
  figuras: "reports/figuras"
  metricas: "reports/metricas"

# -----------------------------------------------------------------------------
# CARGA DE DATOS
# -----------------------------------------------------------------------------
datos:
  # Nombres canonicos de las clases. El indice en esta lista ES la etiqueta
  # entera: 0 = sin grieta, 1 = con grieta. La clase positiva (grieta) debe ser
  # la ultima porque el modelo es binario con salida sigmoide.
  clases: ["Negative", "Positive"]

  # Alias aceptados al detectar subcarpetas (comparacion en minusculas, sin
  # acentos). Cubre las variantes mas comunes de los datasets publicos.
  alias_clases:
    Negative: ["negative", "negativo", "no_crack", "nocrack", "sin_grieta", "uncracked", "0"]
    Positive: ["positive", "positivo", "crack", "cracked", "con_grieta", "grieta", "1"]

  # Solo se usa si NO hay subcarpetas por clase y si existe un CSV.
  csv:
    nombre_archivo: "labels.csv"   # se busca dentro de rutas.datos_raw
    columna_imagen: "filename"
    columna_etiqueta: "label"

  extensiones: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff"]

  # Split estratificado. train + val + test debe sumar 1.0
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    # Si el dataset son recortes (patches) de una misma superficie/foto madre,
    # un split aleatorio produce FUGA DE DATOS: parches casi identicos caen en
    # train y en test a la vez y la exactitud queda inflada.
    # Con agrupar_por_origen: true, el split se hace por grupo (todos los
    # parches de una misma superficie caen en la misma particion).
    agrupar_por_origen: false
    # Expresion regular aplicada al nombre del archivo (sin extension) para
    # extraer el identificador de la superficie de origen. El grupo 1 de la
    # regex es el identificador. Ejemplo para nombres tipo "CD_0042_03.jpg":
    #   "^([A-Za-z]+_\\d+)"  ->  agrupa "CD_0042"
    regex_origen: "^([A-Za-z]+[_-]?\\d+)"

# -----------------------------------------------------------------------------
# PREPROCESAMIENTO Y AUMENTO
# -----------------------------------------------------------------------------
preproceso:
  # COMPROMISO RESOLUCION <-> DESEMPENO (justificado en reports/analisis.md):
  # 160x160 conserva la firma de una grieta fina (bordes de alta frecuencia,
  # ~2-4 px de ancho) y cuesta ~2.0x menos computo que 224x224
  # (160^2/224^2 = 0.51). Con 128x128 el costo baja otro 36%, pero las grietas
  # capilares empiezan a perderse por submuestreo. 160 es el punto de equilibrio
  # para entrenar en CPU sin sacrificar recall en la clase peligrosa.
  alto: 160
  ancho: 160
  canales: 3

  # Rango de normalizacion. "0_1" divide por 255. "menos1_1" mapea a [-1, 1],
  # que es el preprocesado nativo de MobileNetV2 (tf.keras.applications
  # .mobilenet_v2.preprocess_input). La linea base usa 0_1.
  # El modelo de transfer learning inserta su capa de preprocesado internamente,
  # por lo que el pipeline entrega SIEMPRE tensores en [0, 1] y cada modelo
  # ajusta el rango que necesita. Asi la app solo tiene que normalizar una vez.
  normalizacion: "0_1"

  aumento:
    activo: true          # se aplica UNICAMENTE al split de entrenamiento
    volteo_horizontal: true
    volteo_vertical: true  # valido aqui: una grieta no tiene "arriba" canonico
    rotacion: 0.10        # fraccion de 2*pi -> +-36 grados
    zoom: 0.10
    contraste: 0.15
    brillo: 0.15
    traslacion: 0.05

    # -------------------------------------------------------------------------
    # DEGRADACION DE ESCALA
    #
    # §4.6 demuestra que la brecha con las fotografias propias es en buena parte
    # un desajuste de escala: los parches de entrenamiento se reducen 1.4x al
    # entrar al modelo y una foto de telefono se reduce 7.5x, lo que borra las
    # fisuras finas antes de que el modelo las vea.
    #
    # El analisis por mosaicos lo corrige en INFERENCIA, a cambio de 2.4x de
    # coste. Esta capa ataca la misma causa en ENTRENAMIENTO: reduce la imagen
    # por un factor aleatorio y la restaura, de modo que el modelo aprenda a
    # reconocer grietas ya degradadas. Si funciona, el troceado deja de ser
    # necesario y se recupera el coste.
    #
    # Viene DESACTIVADA por defecto a proposito: activarla cambia el modelo, y
    # todas las metricas del informe se generaron sin ella. Es un experimento
    # que se lanza con --nombre propio para no pisar el modelo bueno:
    #   python scripts/train_transfer.py --config config.yaml --nombre mobilenetv2_escala
    # -------------------------------------------------------------------------
    degradacion_escala:
      activo: false
      # 4.0 cubre el rango observado: las fotos propias sufren 7.5x frente al
      # 1.4x del entrenamiento, es decir 5.3x de diferencia relativa.
      factor_maximo: 4.0
      # Fraccion de lotes degradados. El resto pasa intacto para que el modelo no
      # olvide como es una grieta bien resuelta: se busca robustez a la escala,
      # no sustituir un sesgo por el contrario.
      probabilidad: 0.5

  # tf.data
  barajar_buffer: 2000
  cache: false             # pon false si el dataset no cabe en RAM
  prefetch: true

# -----------------------------------------------------------------------------
# ENTRENAMIENTO
# -----------------------------------------------------------------------------
entrenamiento:
  # Lote pequeno: en CPU un lote grande no acelera y dispara el uso de RAM.
  batch_size: 32
  epocas: 20
  tasa_aprendizaje: 0.001
  # Fraccion del dataset usada cuando se pasa --subset por CLI sin valor.
  subset_por_defecto: 0.1

  callbacks:
    early_stopping:
      activo: true
      monitor: "val_loss"
      paciencia: 5
      restaurar_mejores_pesos: true
    reduce_lr:
      activo: true
      monitor: "val_loss"
      factor: 0.5
      paciencia: 2
      lr_minimo: 0.0000001
    checkpoint:
      activo: true
      monitor: "val_loss"
      guardar_solo_mejor: false   # false => se guarda cada epoca => se puede reanudar

  # Pesos de clase: si el dataset esta desbalanceado, penaliza mas el error en
  # la clase positiva (grieta). "auto" los calcula con sklearn; null los desactiva.
  pesos_clase: "auto"

# Linea base: CNN pequena entrenada desde cero. Es el punto de comparacion
# exigido por la asignatura, no un modelo candidato a produccion.
baseline:
  nombre: "baseline_cnn"
  filtros: [16, 32, 64]      # 3 bloques conv -> ~100k parametros
  kernel: 3
  dropout: 0.3
  unidades_densa: 64

# Transfer learning
transfer:
  nombre: "mobilenetv2"
  # NOTA: EfficientNet-Lite NO esta expuesto en keras.applications (solo existe
  # como modelo de TF Hub / TFLite Model Maker). Se usa MobileNetV2, que es el
  # estandar de facto para inferencia movil y esta disponible nativamente.
  arquitectura_base: "MobileNetV2"
  alpha: 0.75            # width multiplier: 0.75 recorta ~44% de parametros
  pesos: "imagenet"
  dropout: 0.3
  unidades_densa: 64

  fine_tuning:
    activo: true
    # Cuantas capas finales de la base se descongelan. MobileNetV2 tiene 154
    # capas; descongelar las ultimas ~30 equivale a los 2-3 bloques finales.
    capas_a_descongelar: 30
    tasa_aprendizaje: 0.00001   # 1e-5: LR alto aqui destruye los pesos preentrenados
    epocas: 10

# -----------------------------------------------------------------------------
# EVALUACION
# -----------------------------------------------------------------------------
evaluacion:
  # Umbral de decision por defecto para P(grieta).
  # 0.5 es el neutral; bajarlo aumenta recall (menos falsos negativos) a costa
  # de precision. En seguridad estructural el falso negativo es el error caro.
  umbral: 0.5
  # Recall minimo que se quiere garantizar en la clase "con grieta" al buscar
  # automaticamente un umbral operativo sobre la curva precision-recall.
  recall_objetivo: 0.95

complejidad:
  repeticiones_latencia: 60   # >= 50 exigidas por el enunciado
  repeticiones_calentamiento: 10
  batch_inferencia: 1         # escenario real: una foto a la vez

# -----------------------------------------------------------------------------
# INCLINOMETRIA (OpenCV: Canny + Hough)
# -----------------------------------------------------------------------------
inclinacion:
  desenfoque_kernel: 5        # gaussiano; impar. Suprime ruido antes de Canny
  canny_umbral_bajo: 50
  canny_umbral_alto: 150
  hough_rho: 1                # resolucion de distancia (px)
  hough_theta_grados: 1.0     # resolucion angular
  hough_umbral: 60            # votos minimos para aceptar una linea
  hough_min_longitud_linea: 120
  hough_max_separacion: 10    # maxGap: huecos tolerados dentro de una linea
  # Solo se consideran "elemento vertical" las lineas cuya desviacion respecto
  # a la vertical sea menor a este valor. Filtra suelos, dinteles y horizontes.
  tolerancia_vertical_grados: 35.0
  # Numero minimo de lineas coherentes para dar el angulo por fiable.
  min_lineas_confiables: 3
  # Longitud minima como fraccion del lado menor de la imagen (independiza el
  # filtro de la resolucion de la foto).
  min_longitud_relativa: 0.15

  # ---------------------------------------------------------------------------
  # GUARDARRAILES DE VEROSIMILITUD
  #
  # Hough encuentra rectas pero no sabe QUE representa cada una. En un primer
  # plano de pared sin aristas, la unica recta casi vertical es la propia grieta,
  # y el modulo llegaba a reportarla como "desaplome de 34.90 grados, FIABLE",
  # disparando la regla R5 y un riesgo Alto falso (reports/analisis.md, §4.5).
  #
  # Estos tres filtros descartan la medida en lugar de emitir un numero sin
  # sentido. Ninguno corrige el angulo: solo marcan fiable=False con su motivo.
  # ---------------------------------------------------------------------------

  # Desaplome maximo fisicamente verosimil. Una edificacion en pie esta a pocos
  # grados de plomo: 10 grados equivalen a un 17.6% de deriva, muy por encima de
  # cualquier estructura que siga en servicio. Un valor mayor indica casi con
  # seguridad que se esta midiendo otra cosa (una grieta, un cable, un mueble).
  desaplome_maximo_plausible_grados: 10.0

  # Dispersion maxima (MAD) de los angulos coherentes. Una arista real produce
  # segmentos que coinciden entre si (dispersion ~0); una grieta sinuosa produce
  # tramos con orientaciones dispares. Medido sobre las fotos propias: las
  # configuraciones que miden aristas dan 0.00-0.61, las que miden grietas 1.34-1.50.
  dispersion_maxima_grados: 2.0

  # Extension vertical minima que deben abarcar los segmentos coherentes, como
  # fraccion del alto de la imagen. El eje de una columna recorre casi todo el
  # encuadre; un grupo de segmentos cortos y dispersos, no.
  min_extension_vertical: 0.30

# Clasificacion de orientacion de la grieta con la misma transformada de Hough.
# Umbrales en grados respecto a la horizontal (0 = horizontal, 90 = vertical).
orientacion_grieta:
  umbral_horizontal: 25.0     # |angulo| < 25  -> horizontal
  umbral_vertical: 65.0       # |angulo| > 65  -> vertical ; resto -> diagonal

# -----------------------------------------------------------------------------
# MOTOR DE REGLAS DE RIESGO
# Contexto normativo: NSR-10 (Reglamento Colombiano de Construccion Sismo
# Resistente). Los valores son criterios de tamizaje para inspeccion visual
# rapida, NO limites normativos de aceptacion estructural.
# -----------------------------------------------------------------------------
riesgo:
  # Probabilidad de grieta a partir de la cual se considera que hay grieta.
  umbral_grieta: 0.5
  # Probabilidad alta: evidencia fuerte, sube el nivel por si sola en elementos
  # criticos.
  umbral_grieta_alta: 0.85

  # Desaplome (desviacion respecto a la vertical) en grados.
  # Referencia: la NSR-10 (Titulo A, derivas) limita la deriva de piso al 1.0%
  # de la altura de entrepiso para estructuras de concreto = ~0.57 grados.
  # Se toma 1.0 grado como umbral de atencion (margen de medicion fotografica)
  # y 2.0 grados (~3.5% de deriva) como desaplome severo.
  desaplome_atencion_grados: 1.0
  desaplome_severo_grados: 2.0

  # Elementos considerados criticos: su falla compromete la estabilidad global
  # (NSR-10 Titulo C). Un muro divisorio no portante no esta en esta lista.
  elementos_criticos: ["columna", "viga", "muro_portante"]

  # Orientaciones de grieta consideradas de alta gravedad segun el elemento.
  # Justificacion en src/risk/reglas.py y en reports/analisis.md.
  orientaciones_graves:
    muro_portante: ["diagonal"]
    muro_divisorio: ["diagonal"]
    columna: ["horizontal", "diagonal"]
    viga: ["diagonal", "vertical"]
    losa: ["diagonal"]

  # Confianza minima del modulo de inclinometria para que sus reglas cuenten.
  # Por debajo, el angulo se declara no fiable y no dispara reglas de desaplome.
  min_confianza_inclinacion: 3

# -----------------------------------------------------------------------------
# APLICACION STREAMLIT
# -----------------------------------------------------------------------------
app:
  titulo: "Evaluacion de Riesgo Estructural"
  subtitulo: "Deteccion de grietas e inclinacion en elementos estructurales"
  # ---------------------------------------------------------------------------
  # QUE MODELO USA CADA MODO
  #
  # La aplicacion NO ofrece un selector de modelo, y esa ausencia es una decision
  # de diseno. Foto y video imponen restricciones opuestas, y cada una tiene una
  # respuesta medida:
  #
  #   FOTOGRAFIA - se admite un segundo de calculo, manda el acierto.
  #     Sobre las 60 fotos propias, con mosaicos de 480 px (§4.6):
  #       MobileNetV2  F1 0.9355  recall 0.97  1 FN  3 FP  0.62 s/foto
  #       Ensemble     F1 0.9508  recall 0.97  1 FN  2 FP  0.78 s/foto
  #       TFLite int8  F1 0.9123  recall 0.87  4 FN  1 FP  0.28 s/foto
  #     Se elige MobileNetV2: el ensemble solo aporta +0.0153 de F1 -un unico
  #     falso positivo de sesenta, indistinguible del ruido con n=60- por un 26%
  #     mas de tiempo, y mantener dos modelos en memoria por eso no se sostiene.
  #     TFLite se descarta aqui porque pierde 0.10 de recall: tres grietas reales
  #     mas sin detectar, que es exactamente el error que §4.1 dice no cometer.
  #
  #   VIDEO - hay 33 ms por fotograma, manda la latencia.
  #     TFLite int8   4.9 ms  -> 30 FPS
  #     MobileNetV2 170.8 ms  ->  6 FPS
  #     Ensemble    189.4 ms  ->  5 FPS
  #     Se elige TFLite: es el unico que sostiene video fluido. Su menor recall
  #     por fotograma se compensa en parte con el suavizado temporal por mediana,
  #     que agrega varias observaciones de la misma escena.
  #
  # Si el modelo elegido no esta en disco, la app repliega a otro y lo advierte.
  # ---------------------------------------------------------------------------
  modelos:
    foto: "keras"     # "keras" | "ensemble" | "tflite"
    video: "tflite"
  archivo_keras: "models/mobilenetv2_finetuned.keras"
  archivo_tflite: "models/mobilenetv2_int8.tflite"
  archivo_baseline: "models/baseline_cnn.keras"

  # Ensemble: promedia las probabilidades de varios modelos .keras.
  #
  # Es el modo por defecto porque es el que mejor funciona sobre fotografias
  # reales. Medido en reports/analisis.md (§3.8), sobre las 60 fotos propias y
  # SIN analisis por mosaicos:
  #   MobileNetV2 sola : F1 0.8000, recall 0.67, 10 falsos negativos
  #   Ensemble         : F1 0.8889, recall 0.80,  6 falsos negativos
  # a cambio de un 11% de latencia (170.8 -> 189.4 ms de mediana). La linea base
  # es solo el 1.9% de los parametros pero aporta el 11% del tiempo: el numero
  # de parametros es un mal predictor de la latencia.
  #
  # ATENCION, esto cambia CON mosaicos activados (§4.6):
  #   MobileNetV2 sola : F1 0.9355, recall 0.97, 1 FN, 3 FP, 0.62 s/foto
  #   Ensemble         : F1 0.9508, recall 0.97, 1 FN, 2 FP, 0.78 s/foto
  # La ventaja del ensemble cae de +0.0889 a +0.0153 de F1 -un unico falso
  # positivo de sesenta- por un 26% mas de tiempo. Buena parte de lo que aportaba
  # era compensar el error de escala que los mosaicos corrigen en su origen. Se
  # conserva por defecto porque en el modo de VIDEO no hay troceado y ahi la
  # ventaja de +0.0889 sigue vigente.
  #
  # Advertencia por si alguien lo evalua: sobre el conjunto de prueba PUBLICO el
  # ensemble empeora ligeramente (0.9423 -> 0.9376). Los dos modelos fallan en
  # imagenes distintas solo fuera de distribucion. No se elige por el numero del
  # dataset publico, sino por el de las fotos reales.
  ensemble:
    componentes:
      - "models/baseline_cnn.keras"
      - "models/mobilenetv2_finetuned.keras"
    # Reparto por igual. Es la unica configuracion validada: ajustar pesos sobre
    # 40 fotografias seria sobreajustar la propia muestra de validacion.
    pesos: [0.5, 0.5]
    # "media" reduce la varianza; "maximo" dispara si cualquier componente ve
    # grieta (mas recall, menos precision). Medido: media 0.8235, maximo 0.8000.
    agregacion: "media"
  max_mb_subida: 10

  # ---------------------------------------------------------------------------
  # ANALISIS POR MOSAICOS
  #
  # El modelo aprendio con parches de mediana 227x227 px, que al reducirse a 160
  # pierden un factor 1.4x. Una fotografia de telefono (mediana 1200x1600) pierde
  # un factor 7.5x: una grieta de 3 px de ancho queda en 0.4 px y desaparece en
  # el redimensionado ANTES de llegar al modelo.
  #
  # Trocear la fotografia en ventanas y evaluarlas por separado devuelve cada
  # region a la escala con la que el modelo fue entrenado. Medido sobre las fotos
  # propias, sin reentrenar nada (ver reports/analisis.md §4.6).
  # ---------------------------------------------------------------------------
  mosaicos:
    activo: true

    # Lado del mosaico. Medido con scripts/evaluar_mosaicos.py sobre las 60
    # fotografias propias, con el ensemble y umbral 0.5:
    #
    #   estrategia        F1      recall  prec    FN  FP  ventanas  s/foto
    #   imagen entera     0.8889  0.80    1.000    6   0     1        0.32
    #   mosaicos 227 px   0.9180  0.93    0.903    2   3   140        2.27
    #   mosaicos 320 px   0.9355  0.97    0.906    1   3    63        1.33
    #   mosaicos 480 px   0.9508  0.97    0.935    1   2    24        0.78
    #   mosaicos 640 px   0.9508  0.97    0.935    1   2    12        0.55
    #
    # La curva tiene un optimo interior, y eso es lo interesante: el mosaico NO
    # debe igualar el tamano de los parches de entrenamiento (227 px), que es
    # justo la peor de las cinco filas. Hay dos efectos opuestos. Mosaicos muy
    # grandes reducen demasiado y borran la grieta; mosaicos muy pequenos la
    # dejan sin contexto (una fisura reconocible necesita ver la pared que la
    # rodea) y multiplican por seis las ocasiones de dar una falsa alarma.
    #
    # 480 y 640 empatan en metricas y fallan en las mismas tres fotos. Se elige
    # 480 por dos razones: el unico falso negativo queda en p=0.222 en vez de
    # p=0.071, es decir, mucho mas cerca de detectarse; y con 24 ventanas en vez
    # de 12 el mapa de calor localiza la grieta con el doble de resolucion.
    # Quien priorice latencia puede poner 640 y ahorrar un 30% del tiempo.
    lado_px: 480

    # Sin solape, una grieta que cayera en la frontera entre dos ventanas
    # quedaria partida en dos mitades irreconocibles. Con 0.5, toda region del
    # tamano del mosaico aparece entera en al menos una ventana.
    solape: 0.5

    # "maximo": si algun trozo tiene grieta, la imagen tiene grieta. Promediar
    # diluiria la unica ventana positiva entre las veintitres de pared sana.
    # El precio es asimetrico: N ventanas son N ocasiones de falso positivo
    # (la precision baja de 1.000 a 0.935). §4.1 argumenta por que en evaluacion
    # estructural ese es el error que conviene cometer.
    agregacion: "maximo"

    # Cota de coste. Al superarla se agranda el mosaico en vez de descartar
    # zonas: perder resolucion es preferible a no mirar parte del muro.
    maximo_mosaicos: 64

    # Por debajo de este lado no se trocea. Una imagen asi ya esta en el rango de
    # escala del entrenamiento, y trocearla solo anadiria falsos positivos.
    lado_minimo_imagen: 600

  # ---------------------------------------------------------------------------
  # CAMARA EN VIVO
  #
  # La captura se hace en el SERVIDOR con cv2.VideoCapture, no en el navegador.
  # Para la sustentacion (una demo local en el portatil del equipo) es lo
  # adecuado y no anade ninguna dependencia. La alternativa, streamlit-webrtc,
  # obligaria a subir Streamlit de 1.39 a 1.61 y a instalar 22 paquetes mas,
  # invalidando el entorno congelado con el que se generaron todas las metricas.
  # ---------------------------------------------------------------------------
  camara:
    # Fuente de video: "equipo" usa la webcam del portatil; "celular" lee el
    # stream MJPEG que publica una aplicacion de camara IP en el telefono.
    #
    # Por que por red y no por WebRTC: usar la camara del movil DESDE EL
    # NAVEGADOR exigiria HTTPS (los navegadores moviles solo dan acceso a la
    # camara en contexto seguro) y la libreria streamlit-webrtc, que obligaria a
    # subir Streamlit de 1.39 a 1.61 e invalidaria el entorno congelado con el
    # que se generaron todas las metricas. Con una app de camara IP, la captura
    # la hace el telefono de forma nativa y OpenCV solo consume el stream: cero
    # dependencias nuevas y sin HTTPS.
    fuente: "equipo"
    # Ancho en pixeles de la previsualizacion de video. NO afecta al analisis:
    # el clasificador recibe siempre el recorte a resolucion completa.
    #
    # Existe porque un stream de telefono llega en vertical (1200x1600) y, a
    # ancho de pagina, desplaza el semaforo de riesgo fuera de la pantalla. Quien
    # inspecciona necesita ver a la vez lo que enfoca y el veredicto: si no, no
    # puede saber que encuadre produjo que resultado.
    ancho_vista: 400
    # URL del stream del telefono. Se puede escribir abreviada ("192.168.1.40:8080"):
    # la interfaz la completa. Puertos habituales: 8080 (IP Webcam), 4747 (DroidCam).
    url_celular: ""
    indice: 0
    # Resolucion de captura. Canny y Hough son lineales en el numero de pixeles:
    # 1920x1080 multiplicaria por seis el trabajo sin aportar ninguna recta que
    # no estuviera ya en 640x480.
    ancho: 640
    alto: 480

    # Fraccion del lado menor que se recorta del centro para CLASIFICAR.
    # El modelo se entreno con parches en primer plano; una webcam da una vista
    # amplia de la habitacion. Sin recorte, una grieta queda reducida a dos o
    # tres pixeles al redimensionar a 160x160.
    # La inclinometria, en cambio, se ejecuta sobre el fotograma COMPLETO:
    # necesita ver el elemento vertical entero (reports/analisis.md, §3.6).
    fraccion_recorte: 0.6

    # Ventana del suavizado temporal por mediana. Sin el, la probabilidad oscila
    # varias decimas entre fotogramas casi identicos y el semaforo parpadea.
    # Mas grande estabiliza mas pero anade retardo al mover la camara.
    ventana_suavizado: 7

    # Duracion de cada rafaga de captura antes de devolver el control a
    # Streamlit. Es el compromiso entre fluidez y capacidad de reaccion: el
    # boton de parar no responde hasta que termina la rafaga en curso.
    # Cada cuanto se refrescan las TARJETAS y el semaforo. El video se pinta en
    # cada fotograma; los textos, a este ritmo. Repintarlos a 15 Hz los vuelve
    # ilegibles: no da tiempo a leer el nivel de riesgo antes de que cambie.
    segundos_entre_textos: 0.4

    # Formato recomendado para video. Con TFLite int8 (4.9 ms) el sistema
    # sostiene video fluido; con el ensemble (189 ms) el techo son ~5 FPS.
    modelo_recomendado: "tflite"
