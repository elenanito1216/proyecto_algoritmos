# =============================================================================
# Configuracion de las herramientas de calidad de codigo.
#
# Vive aqui y no en la configuracion de VS Code para que las mismas reglas
# apliquen tanto al formatear con la extension como al ejecutar `black .` o
# `ruff check .` desde la terminal, y para que sean identicas en el equipo de
# cualquier integrante.
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | data
  | models
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

# Al recorrer un directorio, Ruff solo recoge .py, .pyi y .ipynb. Pero cuando se
# le pasa un archivo POR RUTA asume que es Python y lo intenta parsear, sea lo
# que sea. La extension de VS Code le pasa el archivo que este abierto en el
# editor, asi que abrir README.md producia 2818 errores de sintaxis en un
# documento que no tiene ni una linea de codigo.
#
# Se excluyen por extension los formatos de texto que conviven con el codigo, y
# force-exclude hace que la exclusion valga TAMBIEN para archivos pasados por
# ruta, que es justo el caso del editor y el de los ganchos de pre-commit.
exclude = [
    ".venv",
    "data",
    "models",
    ".ipynb_checkpoints",
    "*.md",
    "*.txt",
    "*.yaml",
    "*.yml",
    "*.toml",
    "*.json",
    "*.csv",
]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: errores
    "W",    # pycodestyle: avisos
    "F",    # pyflakes
    "I",    # isort: orden de imports
    "B",    # flake8-bugbear: fallos logicos frecuentes
    "UP",   # pyupgrade: sintaxis moderna
    "D",    # pydocstyle: docstrings
    "ANN",  # flake8-annotations: type hints
    "SIM",  # flake8-simplify
]
ignore = [
    "D203",    # incompatible con D211 (una de las dos hay que elegir)
    "D212",    # se usa el estilo Google: resumen en la segunda linea
    "D415",    # el resumen no siempre termina en punto en espanol
    "ANN401",  # 'Any' es legitimo en las fronteras con TensorFlow y Streamlit
    "ANN101",  # anotar 'self' no aporta nada; la propia Ruff dejo obsoleta la regla
    "ANN102",  # idem para 'cls'
    "E501",    # la longitud de linea la impone Black, no el linter
    "B008",    # llamadas en valores por defecto: patron habitual de argparse
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Los scripts insertan la raiz en sys.path antes de importar 'src', asi que sus
# imports no pueden ir todos arriba del archivo.
"scripts/*.py" = ["E402"]
"app/*.py" = ["E402"]
# Las pruebas no necesitan docstring en cada funcion de aserto.
"tests/*.py" = ["D103", "ANN201"]
"notebooks/*" = ["D", "ANN", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    # TensorFlow y protobuf emiten avisos de deprecacion que no dependen de
    # este proyecto y ensucian la salida de las pruebas.
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# =============================================================================
# Pylance / Pyright
#
# El proyecto ya tiene tres puertas de calidad: Ruff (lint), Black (formato) y
# pytest (comportamiento). Pylance es un CUARTO analizador, y con esta pila de
# librerias produce sobre todo ruido:
#
#   43 avisos por  tf.keras.*        TensorFlow 2.x expone keras como un alias
#                                    cargado de forma diferida; Pyright no puede
#                                    resolverlo de forma estatica.
#   24 avisos por  st.session_state  acepta atributos arbitrarios POR DISENO.
#   30 usos de     cv2.*             los stubs de opencv-python son parciales.
#
# Ninguno indica un fallo: el codigo pasa Ruff, Black, 116 pruebas y compila.
# Marcar 70 falsos positivos es peor que no marcar nada, porque entrena a
# ignorar los avisos y entonces el de verdad tampoco se ve.
#
# Se silencian solo las categorias que dependen de stubs inexistentes. Se
# CONSERVAN las que si detectan errores reales: variables no definidas, imports
# que no existen, redeclaraciones y parametros mal escritos.
# =============================================================================

[tool.pyright]
include = ["src", "app", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "models"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

# --- Se conservan: detectan errores autenticos ---
reportUndefinedVariable = "error"
reportMissingImports = "error"
reportRedeclaration = "warning"
reportSelfClsParameterName = "warning"

# --- Se silencian: falsos positivos por falta de stubs ---
reportMissingTypeStubs = "none"        # TensorFlow y OpenCV no publican stubs completos
reportAttributeAccessIssue = "none"    # tf.keras.* y st.session_state.*
reportPrivateImportUsage = "none"      # reexportaciones de keras dentro de tensorflow
reportOptionalMemberAccess = "none"    # campos float | None ya comprobados en tiempo de ejecucion
reportOptionalSubscript = "none"
reportOptionalOperand = "none"
reportOptionalIterable = "none"
reportArgumentType = "none"            # cv2 y tf devuelven Any y contaminan la inferencia
reportCallIssue = "none"
reportIndexIssue = "none"
